# Builds the desktop (Steam) app for Windows and Linux.
#
# Runs on its own when the game or desktop/ changes, or by hand from the
# Actions tab ("Run workflow"). When it finishes, the builds are under
# "Artifacts" at the bottom of the run's page.
#
# This never touches the itch build; it only reads the game, like stage.js.
name: Desktop build

on:
  workflow_dispatch:
  push:
    # garage is fast-forwarded to the same commit as main on push live, so
    # building it too would only repeat the main build.
    branches-ignore: [garage]
    paths:
      - "Car_Guy_Sim.html"
      - "assets/**"
      - "desktop/**"
      - "dev/game-files.js"
      - ".github/workflows/desktop-build.yml"

# A newer push to the same branch replaces a build still running.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: car-guy-sim-windows
          # The oldest Ubuntu Tauri recommends, so the AppImage runs on older
          # systems and on the Steam Deck.
          - os: ubuntu-22.04
            artifact: car-guy-sim-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: System packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - name: Build
        working-directory: desktop
        run: |
          npm ci
          npm run build
      - name: Collect
        shell: bash
        run: |
          mkdir out
          bundle=desktop/src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = Windows ]; then
            cp desktop/src-tauri/target/release/car-guy-sim.exe "out/Car Guy Simulator.exe"
            cp $bundle/nsis/*.exe out/
          else
            cp $bundle/appimage/*.AppImage out/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/
