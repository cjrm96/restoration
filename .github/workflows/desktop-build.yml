# Builds the desktop (Steam) app for Windows and Linux.
#
# Runs on its own when the game or desktop/ changes, or by hand from the
# Actions tab ("Run workflow"). When it finishes, the builds are under
# "Artifacts" at the bottom of the run's page.
#
# This never touches the itch build; it only reads the game, like stage.js.
name: Desktop build

on:
  workflow_dispatch:
  push:
    paths:
      - "Car_Guy_Sim.html"
      - "assets/**"
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Build
        working-directory: desktop
        run: |
          npm ci
          npm run build -- --bundles nsis
      - name: Collect
        shell: bash
        run: |
          mkdir out
          cp desktop/src-tauri/target/release/car-guy-sim.exe "out/Car Guy Simulator.exe"
          cp desktop/src-tauri/target/release/bundle/nsis/*.exe out/
      - uses: actions/upload-artifact@v4
        with:
          name: car-guy-sim-windows
          path: out/

  linux:
    # Built on the oldest Ubuntu Tauri recommends so the AppImage runs on
    # older systems and on the Steam Deck.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - name: Build
        working-directory: desktop
        run: |
          npm ci
          npm run build -- --bundles appimage
      - uses: actions/upload-artifact@v4
        with:
          name: car-guy-sim-linux
          path: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
