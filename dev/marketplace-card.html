<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<title>Marketplace — listings prototype</title>
<style>
  :root {
    --bg: #17120f; --panel: #241d17; --panel-2: #1b1511; --panel-3: #2d241d;
    --line: #4b4036; --text: #efe2c6; --text-dim: #8f8476; --muted: #a99b84;
    --gold: #d19a3f; --gold-soft: #c9aa73;
  }
  body { margin: 0; padding: 26px; background: var(--bg); color: var(--text);
         font-family: Georgia, "Times New Roman", "Liberation Serif", serif; }
  h1 { font-size: 17px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-soft); margin: 0 0 4px; }
  .note { color: var(--text-dim); font-size: 12px; margin-bottom: 6px; max-width: 820px; line-height: 1.6; }
  h2 { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
       margin: 30px 0 12px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(172px, 1fr)); gap: 14px; }
  .shot { position: relative; width: 100%; aspect-ratio: 1/1; overflow: hidden;
          border: 1px solid var(--line); border-radius: 6px; background: #0d0a08; }
  .shot svg { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .badge { position: absolute; top: 7px; left: 7px; background: rgba(20,14,10,.82); color: var(--text);
           font-size: 10px; letter-spacing: .06em; padding: 3px 7px; border-radius: 3px;
           border: 1px solid rgba(217,162,79,.35); }
  .price { font-size: 16px; font-weight: bold; color: var(--gold); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .title { font-size: 12.5px; color: var(--text); margin-top: 2px;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .where { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
  .hero { display: flex; gap: 26px; align-items: flex-start; }
  .hero .shot { width: 340px; flex: 0 0 340px; }
  .hero .price { font-size: 27px; margin-top: 0; }
  .hero .title { font-size: 17px; white-space: normal; }
  .hero .where { font-size: 13px; margin-top: 6px; }
  .sub { color: var(--muted); font-size: 12.5px; line-height: 1.65; margin-top: 14px; max-width: 340px; }
  .strip { display: flex; gap: 12px; flex-wrap: wrap; }
  .strip .shot { width: 124px; }
  .cap { font-size: 10.5px; color: var(--text-dim); margin-top: 5px; text-align: center; }
  .phone { width: 390px; border: 1px solid var(--line); border-radius: 10px; padding: 12px;
           background: var(--panel-2); }
  .phone .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
</style>
</head>

function rng(seed){let a=seed>>>0;return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const R=(r,a,b)=>a+r()*(b-a);
const RI=(r,a,b)=>Math.floor(R(r,a,b+1));
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
const chance=(r,p)=>r()<p;

// ── pixel primitives on a 64x64 frame ──
function rect(x,y,w,h,f,o){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"${o!==undefined?` opacity="${o}"`:""}/>`;}
function disc(cx,cy,rad,f){let o="";for(let y=Math.floor(cy-rad);y<=Math.ceil(cy+rad);y++){const dy=y+0.5-cy;const h=Math.sqrt(Math.max(0,rad*rad-dy*dy));if(h<0.4)continue;o+=rect(Math.round(cx-h),y,Math.max(1,Math.round(h*2)),1,f);}return o;}
function ring(cx,cy,rad,th,f){let o="";for(let y=Math.floor(cy-rad);y<=Math.ceil(cy+rad);y++){const dy=y+0.5-cy;const ho=Math.sqrt(Math.max(0,rad*rad-dy*dy));const ri=rad-th;const hi=Math.sqrt(Math.max(0,ri*ri-dy*dy));if(ho<0.4)continue;if(hi<0.4){o+=rect(Math.round(cx-ho),y,Math.max(1,Math.round(ho*2)),1,f);continue;}const w=Math.max(1,Math.round(ho-hi));o+=rect(Math.round(cx-ho),y,w,1,f);o+=rect(Math.round(cx+hi),y,w,1,f);}return o;}

function shapeFor(name, category) {
  for (const [re, k] of SHAPE_RULES) if (re.test(name)) return SHAPES[k];
  const byCat = { brakes:"brakepart", wheels:"wheel", tires:"tire", exhaust:"muffler", engine:"engineblock",
    transmission:"transcase", differential:"transcase", fuel:"tank", cooling:"radiator", interior:"fabric",
    steering:"steeringwheel", suspension:"spring", chrome:"bumper", electrical:"distributor",
    body:"panel", paint:"can" };
  return SHAPES[byCat[category]] || SHAPES.lot;
}

const NOT_LISTABLE = new Set([
  "Show Quality Paint Job","Single Stage Respray","Two Stage Respray","Frame Straightening",
  "Touch-Up Paint","Full Body Restoration","Show Quality Paint","Wet Sand & Buff",
]);
const JOB_TAIL=/\s+(Replacement|Service|Refresh|Rebuild Kit|Rebuild|Restoration|Upgrade|Tune|Overhaul|Conversion|Install|Delete|Swap|Job|Kit|Work|Repair|Fix|Setup)$/i;
function listingNoun(name){
  if(NOUN_OVERRIDE[name])return NOUN_OVERRIDE[name];
  let n=name.replace(/^(Complete|Full|New)\s+/i,"");
  const amp=n.split(" & ");
  if(amp.length===2&&JOB_TAIL.test(" "+amp[1]))n=amp[0];
  for(let i=0;i<3;i++)n=n.replace(JOB_TAIL,"");
  return n.trim();
}

  ["Sutter Flats",9,18],["Ash Creek",12,26],["Mesquite Springs",15,34],

function where(r){
  if(chance(r,.06))return "Ships to you";
  const [t,a,b]=pick(r,TOWNS);
  return `${t} · ${RI(r,a,b)} mi`;
}

const BRAGS=["no lowballers I know what I have","I know what I have","will not separate",
  "text only","first come first served","priced to move"];
const FROM=["off a 65 F-100","off a 72 C10","outta my truck","pulled last week","off my project",
  "from a running truck","took off my build","never installed"];
function sellerTitle(noun,r){
  let t=noun;
  if(chance(r,.34))t+=" "+pick(r,FROM);
  if(chance(r,.42))t+=(chance(r,.5)?" - ":", ")+pick(r,TAGS);
  else if(chance(r,.12))t+=" - "+pick(r,BRAGS);
  if(chance(r,.07))t+="!!";
  const roll=r();
  if(roll<.10)t=t.toUpperCase();
  else if(roll<.22)t=t.toLowerCase();
  if(chance(r,.05))t=t.replace(" ","  ");
  return t;
}

// ── clutter: the junk that is always in frame in a real garage photo ──
function clutter(r){let o="";const n=RI(r,2,5);
  for(let i=0;i<n;i++){const x=RI(r,-2,60),y=RI(r,-2,60);
    switch(RI(r,0,6)){
      case 0:o+=rect(x,y,2,5,"#4a453f")+rect(x-1,y,4,2,"#565049");break;
      case 1:o+=ring(x,y,3,1,"#6b6560");break;
      case 2:o+=rect(x,y,5,3,"#3a3630")+rect(x+1,y+1,3,1,"#22201c");break;
      case 3:o+=rect(x,y,RI(r,7,15),RI(r,4,8),pick(r,["#7a4a3a","#3f4a3a","#4a4550"]),.85);break;
      case 4:o+=rect(x,y,RI(r,10,22),1,"#8f8a82",.5);break;
      case 5:o+=rect(x,y,3,3,"#5a5248");break;
      default:o+=rect(x,y,RI(r,4,9),2,"#6a4a35",.8);break;
    }}return o;}
function intrusion(r){
  if(r()>0.55)return "";
  const i=RI(r,0,3);
  const c=["#7a2f26","#2e3540","#584a37","#3d3d40"][i], hi=["#9c463a","#3e4959","#6f5f46","#515156"][i];
  if(i===0){const y=RI(r,30,52),w=RI(r,18,30);return rect(-6,y,w,30,c)+rect(-6,y,w,1,hi)+rect(w-7,y,1,30,hi);}
  if(i===1){const x=RI(r,34,52),h=RI(r,16,28);return rect(x,-6,30,h,c)+rect(x,h-7,30,1,hi)+rect(x,-6,1,h,hi);}
  if(i===2){const x=RI(r,40,58),y=RI(r,34,50);return rect(x,y,26,26,c)+rect(x,y,26,1,hi)+rect(x,y,1,26,hi);}
  const w=RI(r,14,24);return rect(-6,-6,w,w,c)+rect(w-7,-6,1,w,hi)+rect(-6,w-7,w,1,hi);}
function grime(r){let o="";const n=RI(r,6,16);
  for(let i=0;i<n;i++){const x=RI(r,12,50),y=RI(r,12,50);
    o+=rect(x,y,RI(r,1,3),RI(r,1,2),pick(r,["#5a4632","#3b332c","#7a4a2c","#2c2722"]),R(r,.18,.5));}
  return o;}

const SURFACES={
  concrete:{base:"#6d6a64",name:"concrete floor",speck:(r)=>{let o="";for(let i=0;i<90;i++)o+=rect(RI(r,0,63),RI(r,0,63),1,1,r()>.5?"#5b5854":"#7b7871",R(r,.3,.8));for(let i=0;i<3;i++){o+=rect(RI(r,0,50),RI(r,4,60),RI(r,8,26),1,"#4e4b47",.5);}return o;}},
  tailgate:{base:"#3f4a55",name:"tailgate",speck:(r)=>{let o="";for(let y=4;y<64;y+=9)o+=rect(0,y,64,1,"#2c353e",.55);for(let i=0;i<40;i++)o+=rect(RI(r,0,63),RI(r,0,63),1,1,"#5a6672",R(r,.2,.5));return o;}},
  bench:{base:"#6b4f34",name:"workbench",speck:(r)=>{let o="";for(let i=0;i<14;i++){const y=RI(r,0,63);o+=rect(0,y,64,1,r()>.5?"#5b432c":"#7a5b3e",R(r,.35,.7));}for(let i=0;i<30;i++)o+=rect(RI(r,0,63),RI(r,0,63),1,1,"#4a3625",R(r,.3,.6));return o;}},
  cardboard:{base:"#9a7b52",name:"flattened box",speck:(r)=>{let o="";for(let x=2;x<64;x+=5)o+=rect(x,0,1,64,"#8a6d49",.45);for(let i=0;i<26;i++)o+=rect(RI(r,0,63),RI(r,0,63),1,1,"#755c3d",R(r,.25,.55));return o;}},
  blanket:{base:"#4a4256",name:"moving blanket",speck:(r)=>{let o="";for(let y=3;y<64;y+=11)for(let x=3;x<64;x+=11){o+=rect(x,y,8,1,"#3d3648",.6);o+=rect(x,y,1,8,"#3d3648",.6);}for(let i=0;i<34;i++)o+=rect(RI(r,0,63),RI(r,0,63),1,1,"#5d5470",R(r,.2,.5));return o;}},
  pegboard:{base:"#8a7a5e",name:"pegboard",speck:(r)=>{let o="";for(let y=5;y<64;y+=8)for(let x=5;x<64;x+=8)o+=rect(x,y,2,2,"#5d5340",.75);for(let i=0;i<18;i++)o+=rect(RI(r,0,63),RI(r,0,63),1,1,"#9e8d6e",R(r,.2,.45));return o;}},
  grass:{base:"#4e5539",name:"driveway edge",speck:(r)=>{let o="";for(let i=0;i<70;i++)o+=rect(RI(r,0,63),RI(r,0,63),1,RI(r,1,3),r()>.5?"#5d6544":"#414732",R(r,.3,.7));o+=rect(0,RI(r,36,54),64,RI(r,10,26),"#6d6a64",.9);return o;}},
};
const SURF_BAG=["concrete","concrete","concrete","tailgate","tailgate","bench","bench","cardboard","blanket","blanket","pegboard","grass"];
const LIGHTS={
  flash:{tint:"#fff6e2",warm:.34,amb:"#ffffff",ambA:.10,vig:.30,r:30},
  fluoro:{tint:"#dff0e6",warm:.16,amb:"#c9d8d0",ambA:.07,vig:.16,r:52},
  bulb:{tint:"#ffd08a",warm:.30,amb:"#2a1c10",ambA:.16,vig:.44,r:34},
  door:{tint:"#cfe2ff",warm:.26,amb:"#101822",ambA:.20,vig:.38,r:44},
  dim:{tint:"#8a8f9a",warm:.10,amb:"#0c0b12",ambA:.32,vig:.50,r:46},
};


// Nothing in a scrapyard is all one colour. The same silhouette in cast iron,
// engine orange or bare alloy reads as a different part on the shelf.
const FINISHES = [
  { l:"#d7dade", m:"#b9bcc0", d:"#7e8287", c:"#8e9095" },  // bare steel
  { l:"#a9abae", m:"#8b8d91", d:"#5f6165", c:"#6e7074" },  // cast iron
  { l:"#4a4744", m:"#35322f", d:"#211f1d", c:"#3a3734" },  // painted black
  { l:"#e08b3a", m:"#c06f26", d:"#8a4c17", c:"#b4661f" },  // engine orange
  { l:"#4f7fb5", m:"#3a6494", d:"#26436a", c:"#345a86" },  // engine blue
  { l:"#a5723f", m:"#87542c", d:"#5e381c", c:"#7d4d27" },  // surface rust
  { l:"#d9c98f", m:"#bda874", d:"#8a7a4c", c:"#b09c68" },  // cadmium / zinc
  { l:"#e6ebee", m:"#c9d0d5", d:"#949ba1", c:"#b7bec4" },  // fresh alloy
];
function refinish(svg, f) {
  return svg
    .replace(/#d7dade/g, f.l).replace(/#b9bcc0/g, f.m)
    .replace(/#7e8287/g, f.d).replace(/#8e9095/g, f.c)
    .replace(/#a4a6ab/g, f.l);
}
function photo(seed,name,category,surfaceKey,lightKey){
  const r=rng(seed);
  const S=SURFACES[surfaceKey||pick(r,SURF_BAG)];
  const L=LIGHTS[lightKey||pick(r,Object.keys(LIGHTS))];
  const baseShape=shapeFor(name,category);
  const fin=pick(r,FINISHES);
  const shape=()=>refinish(baseShape(),fin);
  const rot=R(r,-22,22), scale=R(r,.55,1.55), dx=R(r,-14,14), dy=R(r,-12,12);
  const lx=RI(r,4,60), ly=RI(r,-4,40), uid="p"+seed;
  const selfShadow=r()>.7?rect(RI(r,-4,20),RI(r,30,48),RI(r,22,40),RI(r,16,30),"#000",R(r,.18,.32)):"";
  return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <pattern id="dth${uid}" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#000" opacity=".05"/><rect x="2" y="1" width="1" height="1" fill="#fff" opacity=".022"/>
    </pattern>
    <radialGradient id="lit${uid}" gradientUnits="userSpaceOnUse" cx="${lx}" cy="${ly}" r="${L.r}">
      <stop offset="0" stop-color="${L.tint}" stop-opacity="${L.warm}"/>
      <stop offset=".33" stop-color="${L.tint}" stop-opacity="${(L.warm*.55).toFixed(3)}"/>
      <stop offset=".34" stop-color="${L.tint}" stop-opacity="${(L.warm*.5).toFixed(3)}"/>
      <stop offset=".66" stop-color="${L.tint}" stop-opacity="${(L.warm*.18).toFixed(3)}"/>
      <stop offset=".67" stop-color="${L.tint}" stop-opacity="${(L.warm*.14).toFixed(3)}"/>
      <stop offset="1" stop-color="${L.tint}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig${uid}" gradientUnits="userSpaceOnUse" cx="32" cy="32" r="44">
      <stop offset=".4" stop-color="#000" stop-opacity="0"/>
      <stop offset=".72" stop-color="#000" stop-opacity="${(L.vig*.45).toFixed(3)}"/>
      <stop offset="1" stop-color="#000" stop-opacity="${L.vig}"/>
    </radialGradient>
  </defs>
  ${rect(0,0,64,64,S.base)}${S.speck(r)}${intrusion(r)}${clutter(r)}${selfShadow}
  <g transform="translate(${dx.toFixed(1)} ${dy.toFixed(1)}) rotate(${rot.toFixed(1)} 32 32) translate(32 32) scale(${scale.toFixed(2)}) translate(-32 -32)">
    <g opacity=".5" transform="translate(${R(r,1.5,4).toFixed(1)} ${R(r,2,4.5).toFixed(1)})">${shape().replace(/fill="#[0-9a-fA-F]{6}"/g,'fill="#000"')}</g>
    ${shape()}${grime(r)}
  </g>
  ${rect(0,0,64,64,L.amb,L.ambA)}${rect(0,0,64,64,`url(#lit${uid})`)}${rect(0,0,64,64,`url(#vig${uid})`)}${rect(0,0,64,64,`url(#dth${uid})`)}
</svg>`;
}

// ── build the listings ──
const resale=(p)=>Math.max(10,Math.round(p.diy*0.5));
const LISTINGS=PARTS.filter(p=>!NOT_LISTABLE.has(p.name)).map((p,i)=>{
  const seed=(i+1)*2654435761%2147483647;
  const r=rng(seed*3);
  return {...p, noun:listingNoun(p.name), seed,
    title:sellerTitle(listingNoun(p.name),r), place:where(r),
    fresh:chance(r,.14), price:resale(p), listedAt:r()};
}).sort((a,b)=>a.listedAt-b.listedAt);
function card(L){
  return `<div><div class="shot">${photo(L.seed,L.name,L.category)}${L.fresh?'<div class="badge">Just listed</div>':""}</div>
    <div class="price">$${L.price}</div><div class="title">${L.title}</div><div class="where">${L.place}</div></div>`;
}
document.write(`<h1>Marketplace listings</h1>
<div class="note">Every photograph is generated: a surface, a silhouette, a seeded crop, a light and a shadow.
No image files. ${LISTINGS.length} listings from the real parts catalogue, priced at the game's own resale rate.</div>`);

const hero=LISTINGS.find(l=>l.name==="Water Pump Service")||LISTINGS[0];
document.write(`<h2>One listing</h2><div class="hero">
  <div class="shot">${photo(hero.seed,hero.name,hero.category)}<div class="badge">Just listed</div></div>
  <div><div class="price">$${hero.price}</div><div class="title">${hero.title}</div>
  <div class="where">${hero.place}</div>
  <div class="sub">Came off the truck when I put the new one on. Spins free, no play in the
  shaft, wasn't leaking when I pulled it. Cash and it's yours, I'm not shipping it.</div>
  <div class="sub" style="color:var(--text-dim);font-size:11.5px">In the shop this job is called
  <em>Water Pump Service</em>. Nobody buys a service, so the listing sells the pump.</div></div></div>`);

document.write(`<h2>Same part, every surface</h2><div class="strip">` +
  Object.keys(SURFACES).map((k,i)=>`<div><div class="shot">${photo(500+i*17,"Drilled & Slotted Rotors","brakes",k)}</div><div class="cap">${SURFACES[k].name}</div></div>`).join("") + `</div>`);

document.write(`<h2>Every listing in the catalogue</h2><div class="grid">` + LISTINGS.map(card).join("") + `</div>`);
document.write(`<h2>Phone width</h2><div class="phone"><div class="grid">` + LISTINGS.slice(0,8).map(card).join("") + `</div></div>`);
</script></body></html>
