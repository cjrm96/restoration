[package]
name = "car-guy-sim"
version = "0.0.0" # the app version comes from GAME_VERSION via stage.js
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Default features minus "compression": the art and music are already
# compressed, so brotli would only slow builds and asset loads.
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "x11", "dbus"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
