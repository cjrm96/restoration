[package]
name = "car-guy-sim"
version = "0.0.0" # the app version comes from GAME_VERSION via stage.js
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
